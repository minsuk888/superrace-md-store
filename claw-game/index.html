<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SUPER RACE 3D 인형뽑기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a12; font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #scene { position:absolute; inset:0; }
  .overlay { position:absolute; z-index:10; color:#fff; }

  #brand { top:22px; left:26px; display:flex; align-items:center; gap:14px; }
  #brand .flag { width:44px; height:44px; border-radius:8px;
    background:repeating-conic-gradient(#111 0% 25%, #fff 0% 50%) 0 0/50% 50%; border:2px solid #ff3fd1; }
  #brand h1 { font-size:25px; font-weight:800; letter-spacing:1px; }
  #brand h1 span { color:#ff3fd1; }
  #brand small { display:block; font-size:12px; font-weight:400; color:#9aa; letter-spacing:3px; }

  #score { top:96px; left:26px; display:flex; gap:12px; }
  .scorebox { background:rgba(10,10,20,.7); border:1px solid rgba(255,255,255,.12);
    border-radius:12px; padding:7px 18px; text-align:center; }
  .scorebox .n { font-size:24px; font-weight:800; color:#ff9ae0; }
  .scorebox .l { font-size:10px; color:#9aa; letter-spacing:2px; }

  #playerlist { top:170px; left:26px; display:flex; flex-direction:column; gap:8px; max-width:230px; }
  .ptag { display:flex; align-items:center; gap:9px; background:rgba(10,10,20,.7);
    border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:7px 13px; font-size:15px; font-weight:700; }
  .ptag .sw { width:13px; height:13px; border-radius:4px; flex:none; }

  #qrcard { top:22px; right:26px; background:rgba(255,255,255,.97); color:#111;
    border-radius:16px; padding:16px 16px 12px; text-align:center;
    box-shadow:0 8px 40px rgba(255,63,209,.35); }
  #qrcard h2 { font-size:14px; margin-bottom:9px; font-weight:700; }
  #qrcard h2 b { color:#ff3fd1; }
  #qr { width:168px; height:168px; margin:0 auto; }
  #qr img, #qr canvas { width:100% !important; height:100% !important; }
  #roomtag { margin-top:7px; font-size:11px; color:#888; letter-spacing:1px; }

  #feed { top:280px; right:26px; width:250px; display:flex; flex-direction:column; gap:7px; }
  #feed h3 { font-size:12px; color:#9aa; letter-spacing:2px; text-align:right; margin-bottom:2px; }
  .win-item { background:rgba(10,10,20,.78); border:1px solid rgba(255,63,209,.4);
    border-radius:10px; padding:8px 12px; font-size:13px; line-height:1.5; }
  .win-item b { color:#ff9ae0; }
  .win-item .code { font-family:monospace; font-weight:700; color:#2ee56b; letter-spacing:1px; }

  #status { left:50%; bottom:26px; transform:translateX(-50%);
    background:rgba(10,10,20,.72); border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(8px); border-radius:999px; padding:12px 32px;
    font-size:19px; font-weight:600; white-space:nowrap; }
  #status .dot { display:inline-block; width:10px; height:10px; border-radius:50%;
    background:#666; margin-right:10px; vertical-align:2px; }
  #status.on .dot { background:#2ee56b; box-shadow:0 0 10px #2ee56b; }

  #bigmsg { left:50%; top:38%; transform:translate(-50%,-50%); font-size:64px; font-weight:900;
    text-shadow:0 4px 30px rgba(0,0,0,.7); opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s; color:#ff9ae0; letter-spacing:2px; text-align:center; }
  #bigmsg.show { opacity:1; transform:translate(-50%,-50%) scale(1.06); }
  #bigmsg small { display:block; font-size:30px; color:#fff; margin-top:6px; }

  .confetti { position:absolute; width:10px; height:16px; z-index:20; top:-20px;
    animation:fall linear forwards; pointer-events:none; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.9; } }
  #hint { right:26px; bottom:24px; font-size:11px; color:#667; text-align:right; line-height:1.7; }

  #touchgrab { left:26px; bottom:26px; display:none; padding:18px 30px; border:none; border-radius:18px;
    font-size:22px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(180deg, #ff7ae0, #d81fae);
    box-shadow:0 6px 0 #6d0a58, 0 10px 22px rgba(216,31,174,.4); }
  #touchgrab:active { transform:translateY(4px); box-shadow:0 2px 0 #6d0a58; }
  #touchgrab.show { display:block; }
</style>
</head>
<body>
<div id="scene"></div>

<div class="overlay" id="brand">
  <div class="flag"></div>
  <h1>SUPER <span>RACE</span> 뽑기<small>MD STORE CLAW MACHINE</small></h1>
</div>

<div class="overlay" id="score">
  <div class="scorebox"><div class="n" id="plays">0</div><div class="l">PLAYS</div></div>
  <div class="scorebox"><div class="n" id="wins">0</div><div class="l">WINS</div></div>
</div>

<div class="overlay" id="playerlist"></div>

<div class="overlay" id="qrcard">
  <h2>📱 QR 스캔 → 이름 입력 → <b>플레이!</b></h2>
  <div id="qr"></div>
  <div id="roomtag">연결 준비 중…</div>
</div>

<div class="overlay" id="feed">
  <h3>🏆 당첨자 — 경품 교환 확인용</h3>
</div>

<div class="overlay" id="status"><span class="dot"></span><span id="statustext">폰으로 QR을 스캔하면 게임이 시작됩니다 (최대 4명 동시)</span></div>
<div class="overlay" id="bigmsg"></div>
<div class="overlay" id="hint">현장 테스트: 방향키 이동 / 스페이스 잡기<br>터치 기기: 화면 드래그로 이동</div>
<button class="overlay" id="touchgrab">🕹️ 잡기!</button>

<script src="lib/three.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/mqtt.min.js"></script>
<script>
'use strict';
// ============================================================
//  SUPER RACE 3D Claw Machine — big screen page
//  up to 4 phones control their own named claw simultaneously
// ============================================================

// ---------- constants ----------
const MAX_PLAYERS = 4;
const BOUNDS = { minX:-3.55, maxX:3.55, minZ:-1.30, maxZ:1.30 };
const RAIL_Y = 3.35;
const FLOOR_Y = 0;
const HOLE = { x:2.95, z:0.86, r:0.46 };
const HOME_X = [-1.3, 1.3, -2.7, 0.3];   // per-slot home position
const HOME_Z = 0.2;
const PRIZE_R = 0.27;
const PRIZE_COUNT = 52;
const CLAW_SPEED = 2.0;
const GRAVITY = 9.8;

const PLAYER_COLORS = [0xff3fd1, 0x2e9cff, 0x2ee56b, 0xffd24a];
const PLAYER_COLORS_CSS = ['#ff3fd1', '#2e9cff', '#2ee56b', '#ffd24a'];

// 경품 목록 — 이름/이모지/가중치(높을수록 잘 나옴)
const PRODUCTS = [
  { name:'2026 레이싱 캡', emoji:'🧢', weight:1 },
  { name:'SUPER RACE 티셔츠', emoji:'👕', weight:1 },
  { name:'레이싱 키링', emoji:'🔑', weight:3 },
  { name:'체커기 스티커 세트', emoji:'🏁', weight:4 },
  { name:'SUPER RACE 포스터', emoji:'🖼️', weight:3 },
];
function pickProduct() {
  const total = PRODUCTS.reduce((s,p)=>s+p.weight, 0);
  let r = Math.random() * total;
  for (const p of PRODUCTS) { r -= p.weight; if (r <= 0) return p; }
  return PRODUCTS[PRODUCTS.length-1];
}

// ---------- three.js scene ----------
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 15, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 60);
camera.position.set(0, 2.55, 7.7);
camera.lookAt(0, 2.3, 0);

// environment map (drawn on a canvas): dark room + ceiling LED strips + pink
// floor glow — gives the chrome claw and glossy cabinet something to reflect
(function makeEnv() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#3c3c48'); g.addColorStop(0.5, '#141419'); g.addColorStop(1, '#331424');
  c.fillStyle = g; c.fillRect(0, 0, 512, 256);
  c.fillStyle = '#e4f4ff';
  for (let i = 0; i < 6; i++) c.fillRect(24 + i * 82, 26, 48, 11);
  c.fillStyle = '#ff8ade';
  c.fillRect(0, 208, 512, 20);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
})();

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 0.75);
key.position.set(3, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9; key.shadow.camera.right = 9;
key.shadow.camera.top = 7;   key.shadow.camera.bottom = -7;
scene.add(key);
// interior: cool-white ceiling light + pink floor glow (like the reference)
const ceilLight = new THREE.PointLight(0xe8f4ff, 1.25, 8);
ceilLight.position.set(0, 3.5, 0.4);
scene.add(ceilLight);
const floorGlow = new THREE.PointLight(0xff5fd8, 1.3, 6);
floorGlow.position.set(0, 0.5, 0.3);
scene.add(floorGlow);
// marquee + neon pillar spill
const marqueeLight = new THREE.PointLight(0xff4fd8, 1.1, 11);
marqueeLight.position.set(0, 4.6, 2.6);
scene.add(marqueeLight);
const neonL = new THREE.PointLight(0xff4fd8, 0.6, 5);
neonL.position.set(-3.4, 1.8, 2.0);
scene.add(neonL);
const neonR = neonL.clone();
neonR.position.x = 3.4;
scene.add(neonR);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70),
  new THREE.MeshStandardMaterial({ color:0x101018, roughness:0.9 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.5;
ground.receiveShadow = true;
scene.add(ground);

// ---------- cabinet (white/chrome + pink neon, modeled on the reference) ----------
const machine = new THREE.Group();
scene.add(machine);

const whiteGloss = new THREE.MeshPhysicalMaterial({ color:0xf2eff4, roughness:0.32, metalness:0.05, clearcoat:0.9, clearcoatRoughness:0.25 });
const silverMat  = new THREE.MeshStandardMaterial({ color:0xd9d9e2, roughness:0.22, metalness:0.85 });
const chromeMat  = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.12, metalness:1.0 });
const darkMat    = new THREE.MeshStandardMaterial({ color:0x1a1a22, roughness:0.5, metalness:0.5 });
const pinkNeonMat  = new THREE.MeshStandardMaterial({ color:0xff9ae2, emissive:0xff2fc8, emissiveIntensity:2.1, roughness:0.4 });
const pinkPanelMat = new THREE.MeshStandardMaterial({ color:0xffb2e9, emissive:0xff3fd1, emissiveIntensity:1.35, roughness:0.5 });
const ledWhiteMat  = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xd4ecff, emissiveIntensity:2.4 });
const glassMat = new THREE.MeshPhysicalMaterial({ color:0xffffff, transmission:0.95, roughness:0.04, thickness:0.04, ior:1.5, transparent:true, metalness:0, side:THREE.DoubleSide });
const floorPink = new THREE.MeshStandardMaterial({ color:0xffb5e8, emissive:0xff3fd1, emissiveIntensity:0.22, roughness:0.16, metalness:0.2 });

const CAB_W = 8.0, CAB_D = 3.2, H = 3.9;

// body
const base = new THREE.Mesh(new THREE.BoxGeometry(CAB_W+0.5, 1.5, CAB_D+0.5), whiteGloss);
base.position.y = -0.75;
base.castShadow = base.receiveShadow = true;
machine.add(base);
const baseTrim = new THREE.Mesh(new THREE.BoxGeometry(CAB_W+0.6, 0.14, CAB_D+0.6), silverMat);
baseTrim.position.y = -0.02;
machine.add(baseTrim);

// glossy pink play floor
const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(CAB_W, 0.1, CAB_D), floorPink);
floorMesh.position.y = -0.05;
floorMesh.receiveShadow = true;
machine.add(floorMesh);

// prize chute (right side, like the reference) with chrome rim + acrylic guard
const holeMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(HOLE.r, HOLE.r, 0.14, 32),
  new THREE.MeshBasicMaterial({ color:0x0a0a10 })
);
holeMesh.position.set(HOLE.x, 0.02, HOLE.z);
machine.add(holeMesh);
// raised transparent cylinder: prizes must be dropped in from above
const TUBE_H = 1.05, TUBE_R = HOLE.r + 0.05;
const tube = new THREE.Mesh(
  new THREE.CylinderGeometry(TUBE_R, TUBE_R, TUBE_H, 36, 1, true),
  new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.2, roughness:0.05, metalness:0.85, side:THREE.DoubleSide })
);
tube.position.set(HOLE.x, TUBE_H/2, HOLE.z);
machine.add(tube);
[0.03, TUBE_H].forEach(y => {
  const rim = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R, 0.035, 12, 40), chromeMat);
  rim.rotation.x = Math.PI/2;
  rim.position.set(HOLE.x, y, HOLE.z);
  machine.add(rim);
});

// glass walls — the FRONT pane must not use transmission: refractive glass
// drops transparent objects behind it (aim laser, shadows) from its pass
const glassFrontMat = new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.07, roughness:0.05, metalness:0.9, side:THREE.DoubleSide });
function wall(w, h, x, z, ry, mat) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat || glassMat);
  m.position.set(x, h/2, z);
  m.rotation.y = ry;
  machine.add(m);
}
wall(CAB_W, H,  0,  CAB_D/2+0.02, 0, glassFrontMat);
wall(CAB_W, H,  0, -CAB_D/2-0.02, 0);
wall(CAB_D, H, -CAB_W/2-0.02, 0, Math.PI/2);
wall(CAB_D, H,  CAB_W/2+0.02, 0, Math.PI/2);

// corner pillars (white) + pink neon tubes on the front pair
[[-CAB_W/2, -CAB_D/2],[CAB_W/2, -CAB_D/2],[-CAB_W/2, CAB_D/2],[CAB_W/2, CAB_D/2]].forEach(([x,z])=>{
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.18, H, 0.18), whiteGloss);
  p.position.set(x, H/2, z);
  p.castShadow = true;
  machine.add(p);
});
[-1, 1].forEach(s => {
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, H+1.1, 12), pinkNeonMat);
  tube.position.set(s*(CAB_W/2+0.28), (H+1.1)/2 - 1.05, CAB_D/2+0.18);
  machine.add(tube);
});

// top lid + glowing pink marquee panel (no text yet — logo slot)
const topLid = new THREE.Mesh(new THREE.BoxGeometry(CAB_W+0.5, 0.42, CAB_D+0.5), whiteGloss);
topLid.position.y = H + 0.21;
topLid.castShadow = true;
machine.add(topLid);
const marqueeBox = new THREE.Mesh(new THREE.BoxGeometry(CAB_W+0.5, 0.85, CAB_D+0.46), silverMat);
marqueeBox.position.y = H + 0.68;
machine.add(marqueeBox);
const marquee = new THREE.Mesh(new THREE.PlaneGeometry(CAB_W-0.15, 0.62), pinkPanelMat);
marquee.position.set(0, H + 0.68, CAB_D/2 + 0.26);
machine.add(marquee);

// ceiling & back panels keep the interior bright (reference has a lit box)
const ceilPanel = new THREE.Mesh(new THREE.BoxGeometry(CAB_W, 0.04, CAB_D),
  new THREE.MeshStandardMaterial({ color:0xf4f6fa, emissive:0xdfeaff, emissiveIntensity:0.16, roughness:0.6 }));
ceilPanel.position.y = H - 0.01;
machine.add(ceilPanel);
const backPanel = new THREE.Mesh(new THREE.PlaneGeometry(CAB_W, H),
  new THREE.MeshStandardMaterial({ color:0xd8cfe0, emissive:0xb9a8c8, emissiveIntensity:0.10, roughness:0.35, metalness:0.35 }));
backPanel.position.set(0, H/2, -CAB_D/2 + 0.02);
machine.add(backPanel);

// interior ceiling LED strips (two rows, cool white)
for (let i=0;i<5;i++) for (let j=0;j<2;j++) {
  const led = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.03, 0.14), ledWhiteMat);
  led.position.set(-3.1 + i*1.55, H - 0.05, j===0 ? -0.85 : 0.85);
  machine.add(led);
}

// fake bloom: additive glow sprites over the marquee, neon tubes, joystick
(function glowPass(){
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(64, 64, 2, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.35, 'rgba(255,140,225,0.45)');
  g.addColorStop(1, 'rgba(255,80,210,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  function glow(x, y, z, sx, sy, opacity) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map:tex, color:0xff6ad9, blending:THREE.AdditiveBlending,
      depthWrite:false, transparent:true, opacity,
    }));
    s.position.set(x, y, z);
    s.scale.set(sx, sy, 1);
    scene.add(s);
  }
  glow(0, H + 0.68, CAB_D/2 + 0.4, CAB_W + 1.6, 2.0, 0.55);                 // marquee
  glow(-(CAB_W/2+0.28), (H+1.1)/2 - 1.05, CAB_D/2 + 0.3, 1.1, H + 1.8, 0.4); // left neon
  glow( (CAB_W/2+0.28), (H+1.1)/2 - 1.05, CAB_D/2 + 0.3, 1.1, H + 1.8, 0.4); // right neon
  glow(-1.4, 0.34, CAB_D/2 + 0.86, 0.7, 0.7, 0.5);                           // joystick ball
})();

// front control deck: joystick, buttons, LED counters, PRIZE OUT plate
const deck = new THREE.Group();
machine.add(deck);
const deckBody = new THREE.Mesh(new THREE.BoxGeometry(CAB_W*0.92, 0.78, 1.35), whiteGloss);
deckBody.position.set(0, -0.4, CAB_D/2 + 0.82);
deckBody.castShadow = deckBody.receiveShadow = true;
deck.add(deckBody);
const deckTop = new THREE.Mesh(new THREE.BoxGeometry(CAB_W*0.92, 0.05, 1.35),
  new THREE.MeshStandardMaterial({ color:0xffaee6, emissive:0xff3fd1, emissiveIntensity:0.28, roughness:0.35, metalness:0.2 }));
deckTop.position.set(0, -0.02, CAB_D/2 + 0.82);
deck.add(deckTop);
const DECK_Y = 0.005, DECK_Z = CAB_D/2 + 0.82;
// joystick
const joyBase = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.05, 20), darkMat);
joyBase.position.set(-1.4, DECK_Y+0.02, DECK_Z);
deck.add(joyBase);
const joyStem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.24, 10), chromeMat);
joyStem.position.set(-1.4, DECK_Y+0.15, DECK_Z);
deck.add(joyStem);
const joyBall = new THREE.Mesh(new THREE.SphereGeometry(0.09, 18, 14),
  new THREE.MeshStandardMaterial({ color:0xff7ad9, emissive:0xff2fc8, emissiveIntensity:1.5, roughness:0.25 }));
joyBall.position.set(-1.4, DECK_Y+0.3, DECK_Z);
deck.add(joyBall);
// buttons
const btnWhite = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.055, 20), ledWhiteMat);
btnWhite.position.set(0.6, DECK_Y+0.02, DECK_Z);
deck.add(btnWhite);
const btnPink = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.055, 20), pinkNeonMat);
btnPink.position.set(1.25, DECK_Y+0.02, DECK_Z);
deck.add(btnPink);
// LED counters (canvas-drawn red digits)
(function counters(){
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.fillStyle = '#0c0c10'; c.fillRect(0,0,512,128);
  c.strokeStyle = '#2c2c34'; c.lineWidth = 6; c.strokeRect(6,6,230,116); c.strokeRect(276,6,230,116);
  c.fillStyle = '#ff2d2d';
  c.font = '900 84px monospace';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('00', 121, 72); c.fillText('00', 391, 72);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.24),
    new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv) }));
  m.position.set(-3.05, DECK_Y+0.03, DECK_Z);
  m.rotation.x = -Math.PI/2;
  deck.add(m);
})();
// PRIZE OUT plate
(function prizeOut(){
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.fillStyle = '#15151c'; c.fillRect(0,0,512,128);
  c.fillStyle = '#f4f2f5';
  c.font = '900 62px sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('PRIZE OUT', 256, 68);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2),
    new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv) }));
  m.position.set(3.05, DECK_Y+0.03, DECK_Z);
  m.rotation.x = -Math.PI/2;
  deck.add(m);
})();

// ---------- claw rig factory (chrome 4-hook claw, coiled cable) ----------
let _shadowTex = null;
function getShadowTexture() {
  if (_shadowTex) return _shadowTex;
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(64, 64, 6, 64, 64, 62);
  g.addColorStop(0, 'rgba(0,0,0,0.85)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.4)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, 128, 128);
  _shadowTex = new THREE.CanvasTexture(cv);
  return _shadowTex;
}
function makeNameSprite(name, colorCss) {
  const cv = document.createElement('canvas');
  cv.width = 320; cv.height = 84;

}
// curved hook profile, +x = radially outward from the claw axis
const HOOK_CURVE = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.05, 0.02, 0),
  new THREE.Vector3(0.16, -0.20, 0),
  new THREE.Vector3(0.15, -0.40, 0),
  new THREE.Vector3(0.03, -0.56, 0),
  new THREE.Vector3(-0.03, -0.60, 0),
]);
const HOOK_GEO = new THREE.TubeGeometry(HOOK_CURVE, 20, 0.026, 8);
const TIP_POS = HOOK_CURVE.getPoint(1);

function createClawRig(colorHex, name) {
  const colorCss = '#' + colorHex.toString(16).padStart(6,'0');
  const accentMat = new THREE.MeshStandardMaterial({ color:colorHex, emissive:colorHex, emissiveIntensity:0.55, roughness:0.35, metalness:0.3 });
  const root = new THREE.Group();
  scene.add(root);

  // trolley: silver block + player-color band
  const trolley = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.5), silverMat);
  trolley.castShadow = true;
  trolley.position.y = RAIL_Y + 0.16;
  root.add(trolley);
  const trolleyBand = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.05, 0.52), accentMat);
  trolleyBand.position.y = RAIL_Y + 0.06;
  root.add(trolleyBand);

  // thin straight cable + coiled section that stretches as the claw drops
  const cable = new THREE.Mesh(
    new THREE.CylinderGeometry(0.016, 0.016, 1, 8),
    new THREE.MeshStandardMaterial({ color:0x15151a, roughness:0.7 })
  );
  root.add(cable);
  const coil = new THREE.Group();
  const coilMat = new THREE.MeshStandardMaterial({ color:0x111116, roughness:0.55 });
  const COIL_N = 8, COIL_LEN = 0.78;
  for (let i=0;i<COIL_N;i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.014, 8, 18), coilMat);
    ring.rotation.x = Math.PI/2;
    ring.position.y = -0.05 - i*(COIL_LEN/COIL_N);
    coil.add(ring);
  }
  coil.position.y = RAIL_Y + 0.02;
  root.add(coil);

  // chrome head: cylindrical housing + tapered cap + player-color ring
  const head = new THREE.Group();
  root.add(head);
  const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.26, 20), chromeMat);
  housing.castShadow = true;
  head.add(housing);
  const capTop = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.12, 0.09, 20), chromeMat);
  capTop.position.y = 0.17;
  head.add(capTop);
  const capBot = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.06, 0.1, 20), chromeMat);
  capBot.position.y = -0.18;
  head.add(capBot);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.128, 0.128, 0.05, 20), accentMat);
  band.position.y = 0.09;
  head.add(band);

  // four curved chrome hooks
  const hooks = [];
  for (let i=0;i<4;i++) {
    const pivot = new THREE.Group();
    pivot.rotation.y = i * Math.PI/2;
    pivot.position.y = -0.2;
    const hook = new THREE.Group();
    const tube = new THREE.Mesh(HOOK_GEO, chromeMat);
    tube.castShadow = true;
    hook.add(tube);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), chromeMat);
    tip.position.copy(TIP_POS);
    hook.add(tip);
    pivot.add(hook);
    head.add(pivot);
    hooks.push(hook);
  }

  const railBar = new THREE.Mesh(new THREE.BoxGeometry(CAB_W - 0.2, 0.07, 0.09), silverMat);
  railBar.position.y = RAIL_Y + 0.16;
  scene.add(railBar);

  // soft drop-shadow that drapes over whatever is under the claw
  const blob = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map:getShadowTexture(), transparent:true, opacity:0.5, depthWrite:false })
  );
  blob.rotation.x = -Math.PI/2;
  blob.renderOrder = 2;
  scene.add(blob);
  // translucent shell marking the exact capsule the claw would grab
  const targetShell = new THREE.Mesh(
    new THREE.SphereGeometry(PRIZE_R*1.14, 20, 14),
    new THREE.MeshBasicMaterial({ color:colorHex, transparent:true, opacity:0.34, depthWrite:false, depthTest:false })
  );
  targetShell.renderOrder = 8;
  targetShell.visible = false;
  scene.add(targetShell);
  const laser = new THREE.Mesh(
    new THREE.CylinderGeometry(0.016, 0.016, 1, 6),
    new THREE.MeshBasicMaterial({ color:colorHex, transparent:true, opacity:0.9, depthWrite:false })
  );
  laser.visible = false;
  scene.add(laser);

  let sprite = null;
  if (name) {
    sprite = makeNameSprite(name, colorCss);
    scene.add(sprite);
  }

  return {
    root, cable, head, railBar, sprite, coil, blob, targetShell, laser,
    // t: 0 = closed (hooks hang, tips converge), 1 = open (hooks flare out)
    setFingers(t) { hooks.forEach(h => { h.rotation.z = t*0.5; }); },
    apply(x, y, z, fingerT) {
      root.position.set(x, 0, z);
      head.position.y = y;
      const len = Math.max((RAIL_Y + 0.05) - y, 0.01);
      cable.scale.y = len;
      cable.position.y = y + len/2;
      // coil compresses when the claw is up, stretches as it descends
      coil.scale.y = THREE.MathUtils.clamp(len / 1.1, 0.12, 1);
      railBar.position.z = z;
      this.setFingers(fingerT);
      if (sprite) sprite.position.set(x, RAIL_Y + 0.44, z);
      // shadow sits on the surface below the claw (pile top or floor) and
      // tightens/darkens as the claw gets closer to it
      const surfY = this.shadowSurfaceY || 0;
      const gap = THREE.MathUtils.clamp((y - 0.72 - surfY) / (RAIL_Y - 0.72), 0, 1);
      blob.position.set(x, surfY + 0.02, z);
      blob.scale.setScalar(0.5 + gap*0.75);
      blob.material.opacity = 0.62 - gap*0.3;
      const lTop = y - 0.78, lLen = Math.max(lTop - surfY, 0.01);
      laser.scale.y = lLen;
      laser.position.set(x, surfY + lLen/2, z);
    },
    dispose() {
      scene.remove(root, railBar, blob, targetShell, laser);
      if (sprite) scene.remove(sprite);
    },
  };
}

// ---------- prizes ----------
const CAPSULE_COLORS = [0xff5fce, 0x9d7bff, 0x5fc9ff, 0xffd24a, 0xff8fb3, 0x7dffd4];
const prizes = [];
function makePrize(x, y, z) {
  const g = new THREE.Group();
  const col = CAPSULE_COLORS[Math.floor(Math.random()*CAPSULE_COLORS.length)];
  const topHemi = new THREE.Mesh(
    new THREE.SphereGeometry(PRIZE_R, 20, 12, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshPhysicalMaterial({ color:col, roughness:0.18, metalness:0, clearcoat:1, clearcoatRoughness:0.12 })
  );
  const botHemi = new THREE.Mesh(
    new THREE.SphereGeometry(PRIZE_R, 20, 12, 0, Math.PI*2, Math.PI/2, Math.PI/2),
    new THREE.MeshPhysicalMaterial({ color:0xf2f2f2, roughness:0.25, clearcoat:1, clearcoatRoughness:0.15 })
  );
  topHemi.castShadow = botHemi.castShadow = true;
  g.add(topHemi, botHemi);
  g.position.set(x, y, z);
  scene.add(g);
  prizes.push({
    mesh:g, pos:g.position, vel:new THREE.Vector3(),
    held:false, gone:false, holder:null, lastHolder:null, restT:0,
    product:pickProduct(),
    spin:new THREE.Vector3((Math.random()-.5), (Math.random()-.5), (Math.random()-.5)),
  });
}
function spawnPrizes(n) {
  let tries = 0;
  while (prizes.filter(p=>!p.gone).length < n && tries++ < 400) {
    const x = BOUNDS.minX + 0.25 + Math.random()*(BOUNDS.maxX-BOUNDS.minX-0.5);
    const z = BOUNDS.minZ + 0.25 + Math.random()*(BOUNDS.maxZ-BOUNDS.minZ-0.5);
    if (Math.hypot(x-HOLE.x, z-HOLE.z) < HOLE.r + PRIZE_R + 0.35) continue;
    makePrize(x, 0.4 + Math.random()*1.4, z);
  }
}
spawnPrizes(PRIZE_COUNT);

// ---------- physics ----------
function physicsStep(dt) {
  for (const p of prizes) {
    if (p.held || p.gone) continue;
    p.vel.y -= GRAVITY * dt;
    p.pos.addScaledVector(p.vel, dt);
    p.mesh.rotation.x += p.spin.x * p.vel.length() * dt;
    p.mesh.rotation.z += p.spin.z * p.vel.length() * dt;

    const dHole = Math.hypot(p.pos.x-HOLE.x, p.pos.z-HOLE.z);
    if (dHole < TUBE_R - PRIZE_R*0.2) {
      // inside the raised tube: free-fall to the win check below the floor
      if (p.pos.y < -1.2 && !p.gone) prizeInHole(p);
      continue;
    }
    if (dHole < TUBE_R + PRIZE_R && p.pos.y < TUBE_H + PRIZE_R*0.5 && dHole > 0.0001) {
      // bounce off the tube's outer acrylic wall
      const nx = (p.pos.x-HOLE.x)/dHole, nz = (p.pos.z-HOLE.z)/dHole;
      p.pos.x = HOLE.x + nx*(TUBE_R + PRIZE_R);
      p.pos.z = HOLE.z + nz*(TUBE_R + PRIZE_R);
      const rel = p.vel.x*nx + p.vel.z*nz;
      if (rel < 0) { p.vel.x -= nx*rel*1.4; p.vel.z -= nz*rel*1.4; }
    }
    if (p.pos.y < FLOOR_Y + PRIZE_R) {
      p.pos.y = FLOOR_Y + PRIZE_R;
      if (p.vel.y < 0) p.vel.y = -p.vel.y * 0.25;
      if (Math.abs(p.vel.y) < 0.4) p.vel.y = 0;
      p.vel.x *= 0.92; p.vel.z *= 0.92;
      // 바닥에서 3초 이상 멈춰 있으면 마지막 소유자 기록 해제
      if (p.lastHolder && p.vel.lengthSq() < 0.01) {
        p.restT += dt;
        if (p.restT > 3) p.lastHolder = null;
      } else p.restT = 0;
    }
    if (p.pos.x < BOUNDS.minX-0.15+PRIZE_R) { p.pos.x = BOUNDS.minX-0.15+PRIZE_R; p.vel.x = Math.abs(p.vel.x)*0.4; }
    if (p.pos.x > BOUNDS.maxX+0.15-PRIZE_R) { p.pos.x = BOUNDS.maxX+0.15-PRIZE_R; p.vel.x = -Math.abs(p.vel.x)*0.4; }
    if (p.pos.z < BOUNDS.minZ-0.15+PRIZE_R) { p.pos.z = BOUNDS.minZ-0.15+PRIZE_R; p.vel.z = Math.abs(p.vel.z)*0.4; }
    if (p.pos.z > BOUNDS.maxZ+0.15-PRIZE_R) { p.pos.z = BOUNDS.maxZ+0.15-PRIZE_R; p.vel.z = -Math.abs(p.vel.z)*0.4; }
  }
  for (let i=0;i<prizes.length;i++) {
    const a = prizes[i];
    if (a.held || a.gone) continue;
    for (let j=i+1;j<prizes.length;j++) {
      const b = prizes[j];
      if (b.held || b.gone) continue;
      const d = new THREE.Vector3().subVectors(b.pos, a.pos);
      const dist = d.length();
      const min = PRIZE_R*2;
      if (dist > 0.0001 && dist < min) {
        d.normalize();
        const push = (min - dist) / 2;
        a.pos.addScaledVector(d, -push);
        b.pos.addScaledVector(d, push);
        const rel = new THREE.Vector3().subVectors(b.vel, a.vel).dot(d);
        if (rel < 0) {
          a.vel.addScaledVector(d, rel*0.5);
          b.vel.addScaledVector(d, -rel*0.5);
        }
      }
    }
  }
}

// ---------- players ----------
const players = new Map();   // conn -> player  (keyboard test player uses key 'local')
const waiting = [];          // conns awaiting a slot (already sent hello)
let totalPlays = 0, totalWins = 0;

function freeSlot() {
  const used = new Set([...players.values()].map(p => p.slot));
  for (let i=0;i<MAX_PLAYERS;i++) if (!used.has(i)) return i;
  return -1;
}
function createPlayer(connKey, conn, name) {
  const slot = freeSlot();
  if (slot < 0) return null;
  const color = PLAYER_COLORS[slot];
  const player = {
    conn, name, slot, color,
    rig: createClawRig(color, name),
    mode:'play', x:HOME_X[slot], y:RAIL_Y, z:HOME_Z,
    joy:{x:0,y:0}, fingerT:1, carried:null, quality:0, timer:0, targetY:0,
    lastJoyAt:0, prevX:HOME_X[slot], prevZ:HOME_Z, vx:0, vz:0,
    swayX:0, swayZ:0, gripOff:{x:0,z:0}, dropT:0, carryT:0,
  };
  players.set(connKey, player);
  refreshPlayerList();
  updateStatusBar();
  return player;
}
function removePlayer(connKey) {
  const p = players.get(connKey);
  if (!p) return;
  if (p.carried) {
    p.carried.held = false;
    p.carried.holder = null;
    p.carried.vel.set(0, -0.5, 0);
  }
  p.rig.dispose();
  players.delete(connKey);
  refreshPlayerList();
  updateStatusBar();
  promoteWaiting();
}
function promoteWaiting() {
  while (waiting.length && freeSlot() >= 0) {
    const w = waiting.shift();
    if (!w.conn.open) continue;
    const player = createPlayer(w.conn, w.conn, w.name);
    if (player) sendTo(w.conn, { t:'role', v:'active', color:PLAYER_COLORS_CSS[player.slot], name:player.name });
  }
  waiting.forEach((w, i) => sendTo(w.conn, { t:'role', v:'busy', pos:i+1 }));
}
function refreshPlayerList() {
  const el = document.getElementById('playerlist');
  el.innerHTML = '';
  for (const p of players.values()) {
    const div = document.createElement('div');
    div.className = 'ptag';
    div.innerHTML = `<span class="sw" style="background:${PLAYER_COLORS_CSS[p.slot]}"></span>${escapeHtml(p.name)}`;
    el.appendChild(div);
  }
}
function updateStatusBar() {
  const n = players.size;
  if (n === 0) setStatus('폰으로 QR을 스캔하면 게임이 시작됩니다 (최대 4명 동시)', false);
  else setStatus(`🎮 ${n}명 플레이 중 — QR 스캔으로 참여 (최대 ${MAX_PLAYERS}명)`, true);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- per-player state machine ----------
function startGrab(p) {
  if (p.mode !== 'play') return;
  p.mode = 'descend';
  totalPlays++;
  document.getElementById('plays').textContent = totalPlays;
  let best = null, bestD = 0.5;
  for (const pr of prizes) {
    if (pr.gone || pr.held) continue;
    const d = Math.hypot(pr.pos.x-p.x, pr.pos.z-p.z);
    if (d < bestD) { bestD = d; best = pr; }
  }
  const tipOffset = 0.72;
  p.targetY = best ? best.pos.y + PRIZE_R*0.4 + tipOffset : FLOOR_Y + 0.16 + tipOffset;
  sendTo(p.conn, { t:'phase', v:'grab' });
}

function updatePlayer(p, dt) {
  switch (p.mode) {
    case 'play': {
      // dead-man: if a remote controller stops streaming (packet loss, app
      // killed mid-drag), stop the claw instead of drifting forever
      if (p.conn && (p.joy.x || p.joy.y) && performance.now() - p.lastJoyAt > 450) {
        p.joy.x = 0; p.joy.y = 0;
      }
      p.x = THREE.MathUtils.clamp(p.x + p.joy.x*CLAW_SPEED*dt, BOUNDS.minX, BOUNDS.maxX);
      p.z = THREE.MathUtils.clamp(p.z + p.joy.y*CLAW_SPEED*dt, BOUNDS.minZ, BOUNDS.maxZ);
      p.fingerT = 1;
      break;
    }
    case 'descend': {
      p.y -= 2.4*dt;
      // the descending claw shoves capsules in the pile aside
      const tipY = p.y - 0.62;
      for (const pr of prizes) {
        if (pr.gone || pr.held) continue;
        const dx = pr.pos.x - p.x, dz = pr.pos.z - p.z;
        const hd = Math.hypot(dx, dz);
        if (hd > 0.02 && hd < 0.4 && pr.pos.y > tipY - 0.12 && pr.pos.y < p.y) {
          const push = (0.4 - hd) * 13 * dt;
          pr.vel.x += dx/hd * push;
          pr.vel.z += dz/hd * push;
        }
      }
      if (p.y <= p.targetY) { p.y = p.targetY; p.mode = 'closing'; p.timer = 0; }
      break;
    }
    case 'closing': {
      p.timer += dt;
      p.fingerT = Math.max(0, 1 - p.timer/0.45);
      if (p.timer >= 0.5) {
        let best = null, bestD = 0.5;
        for (const pr of prizes) {
          if (pr.gone || pr.held) continue;
          const d = Math.hypot(pr.pos.x-p.x, pr.pos.z-p.z);
          if (d < bestD) { bestD = d; best = pr; }
        }
        if (best) {
          // grip quality: distance from the claw axis + how buried the capsule is
          let q = THREE.MathUtils.clamp(1.18 - bestD*1.5, 0.4, 0.97);
          let crowd = 0;
          for (const o of prizes) {
            if (o !== best && !o.gone && !o.held && o.pos.distanceTo(best.pos) < PRIZE_R*2.4) crowd++;
          }
          if (crowd >= 2) q *= 0.9;
          else if (crowd === 1) q *= 0.95;
          if (Math.random() < q) {
            best.held = true;
            best.holder = p;
            best.lastHolder = p;
            best.restT = 0;
            p.carried = best;
            p.quality = q;
            // keep the off-center grip: the capsule hangs where it was grabbed
            p.gripOff.x = THREE.MathUtils.clamp(best.pos.x - p.x, -0.05, 0.05);
            p.gripOff.z = THREE.MathUtils.clamp(best.pos.z - p.z, -0.05, 0.05);
            p.carryT = 0;
            p.swayX = p.swayZ = 0;
            p.dropT = 0;
          } else {
            // squeezed out: the closing hooks kick the capsule away
            let nx = best.pos.x - p.x, nz = best.pos.z - p.z;
            let n = Math.hypot(nx, nz);
            if (n < 0.02) { const a = Math.random()*Math.PI*2; nx = Math.cos(a); nz = Math.sin(a); n = 1; }
            const kick = 1.0 + Math.random()*0.8;
            best.vel.x += nx/n * kick;
            best.vel.z += nz/n * kick;
            best.vel.y += 0.6 + Math.random()*0.5;
            best.lastHolder = null;
          }
        }
        p.mode = 'ascend';
        p.fingerT = p.carried ? 0.2 : 0;
        sendTo(p.conn, { t:'phase', v: p.carried ? 'caught' : 'miss' });
      }
      break;
    }
    case 'ascend': {
      p.y += 2.2*dt;
      p.carryT += dt;
      slipCheck(p, dt);
      if (p.y >= RAIL_Y) { p.y = RAIL_Y; p.mode = p.carried ? 'toChute' : 'return'; }
      break;
    }
    case 'toChute': {
      const dx = HOLE.x - p.x, dz = HOLE.z - p.z;
      const d = Math.hypot(dx, dz);
      p.carryT += dt;
      slipCheck(p, dt);
      if (!p.carried) { p.mode = 'return'; break; }
      if (d < 0.05) { p.mode = 'release'; p.timer = 0; p.dropT = 0; }
      else {
        const s = Math.min(1.7*dt, d);
        p.x += dx/d*s; p.z += dz/d*s;
      }
      break;
    }
    case 'release': {
      p.timer += dt;
      p.fingerT = Math.min(1, p.timer/0.35);
      if (p.carried && p.fingerT > 0.5) {
        const pr = p.carried;
        pr.held = false;
        pr.holder = null;
        pr.vel.set(p.vx*0.3, -0.5, p.vz*0.3);
        p.carried = null;
      }
      if (p.timer >= 0.9) p.mode = 'return';
      break;
    }
    case 'return': {
      const hx = HOME_X[p.slot];
      const dx = hx - p.x, dz = HOME_Z - p.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.05) {
        p.mode = 'play';
        sendTo(p.conn, { t:'phase', v:'play' });
      } else {
        const s = Math.min(1.7*dt, d);
        p.x += dx/d*s; p.z += dz/d*s;
      }
      break;
    }
  }

  // claw velocity (drives carried-capsule sway and drop throws)
  if (dt > 0) {
    p.vx = (p.x - p.prevX) / dt;
    p.vz = (p.z - p.prevZ) / dt;
  }
  p.prevX = p.x; p.prevZ = p.z;

  if (p.carried) {
    // the capsule lags behind claw movement like a pendulum
    const k = Math.min(dt*5, 1);
    p.swayX += ((-p.vx*0.07) - p.swayX) * k;
    p.swayZ += ((-p.vz*0.07) - p.swayZ) * k;
    if (p.dropT > 0) {
      // telegraphed drop: the hooks visibly lose grip before letting go
      p.dropT -= dt;
      p.fingerT = 0.2 + (0.28 - Math.max(p.dropT, 0)) / 0.28 * 0.35;
      if (p.dropT <= 0) {
        const pr = p.carried;
        pr.held = false;
        pr.holder = null;
        pr.vel.set(p.vx*0.5, -0.2, p.vz*0.5);
        p.carried = null;
        sendTo(p.conn, { t:'phase', v:'slip' });
      }
    }
    if (p.carried) {
      p.carried.pos.set(p.x + p.gripOff.x + p.swayX, p.y - 0.52, p.z + p.gripOff.z + p.swayZ);
      p.carried.vel.set(0,0,0);
    }
  }
  // aiming aids: shadow height = pile surface under the claw; the shell marks
  // the exact capsule the grab logic would pick (same radius, same rule)
  let surf = 0, target = null, tBest = 0.5;
  for (const pr of prizes) {
    if (pr.gone || pr.held) continue;
    const d = Math.hypot(pr.pos.x-p.x, pr.pos.z-p.z);
    if (d < 0.55) surf = Math.max(surf, pr.pos.y + PRIZE_R);
    if (d < tBest) { tBest = d; target = pr; }
  }
  p.rig.shadowSurfaceY = surf;
  p.rig.laser.visible = (p.mode === 'play' || p.mode === 'descend');
  if (p.mode === 'play' && target) {
    p.rig.targetShell.visible = true;
    p.rig.targetShell.position.copy(target.pos);
  } else {
    p.rig.targetShell.visible = false;
  }
  p.rig.apply(p.x, p.y, p.z, p.fingerT);
}
function slipCheck(p, dt) {
  if (!p.carried || p.dropT > 0) return;
  // a bad grip fails right at pickup; once it survives the lift it mostly holds
  const early = p.carryT < 0.6 ? 2.6 : 0.5;
  const sway = Math.hypot(p.vx, p.vz);
  const rate = (1 - p.quality) * 0.2 * early + sway * 0.05;
  if (Math.random() < rate*dt) p.dropT = 0.28;
}

// ---------- win handling ----------
function genCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return 'SR-' + s;
}
function prizeInHole(pr) {
  pr.gone = true;
  pr.mesh.visible = false;
  const winner = pr.lastHolder && [...players.values()].includes(pr.lastHolder) ? pr.lastHolder : null;
  if (winner) {
    totalWins++;
    document.getElementById('wins').textContent = totalWins;
    const code = genCode();
    const prod = pr.product;
    bigMsg(`🎉 ${escapeHtml(winner.name)} 당첨!`, `${prod.emoji} ${prod.name}`);
    confetti();
    addWinFeed(winner.name, prod, code);
    sendTo(winner.conn, { t:'result', win:true, prize:{ name:prod.name, emoji:prod.emoji }, code, player:winner.name });
  }
  setTimeout(() => spawnPrizes(PRIZE_COUNT), 3500);
}
function addWinFeed(name, prod, code) {
  const feed = document.getElementById('feed');
  const div = document.createElement('div');
  div.className = 'win-item';
  div.innerHTML = `${prod.emoji} <b>${escapeHtml(name)}</b> — ${escapeHtml(prod.name)}<br>교환코드 <span class="code">${code}</span>`;
  feed.insertBefore(div, feed.children[1] || null);
  while (feed.querySelectorAll('.win-item').length > 6) feed.lastElementChild.remove();
}

// ---------- UI helpers ----------
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statustext');
function setStatus(msg, on) {
  statusText.textContent = msg;
  statusEl.classList.toggle('on', !!on);
}
function bigMsg(main, sub) {
  const el = document.getElementById('bigmsg');
  el.innerHTML = main + (sub ? `<small>${sub}</small>` : '');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}
function confetti() {
  const colors = ['#ff3fd1','#ffd24a','#5fc9ff','#7dffd4','#ff8fb3','#fff'];
  for (let i=0;i<90;i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    c.style.animationDelay = (Math.random()*0.6) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

// ---------- networking (MQTT over WebSocket relay) ----------
// No WebRTC/P2P at all: every message is relayed through a public MQTT
// broker over wss. Works across any network combo (LTE phone + WiFi
// screen) because it's just an outbound websocket on both ends.
// ?b=<url> overrides the broker list (also propagated into the QR).
const DEFAULT_BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081',
];
const brokerOverride = new URLSearchParams(location.search).get('b');
// override first, then the shared default rotation — both pages walk the same
// ordered list, so screen and phones converge on the first live broker
const BROKERS = brokerOverride ? [brokerOverride, ...DEFAULT_BROKERS] : DEFAULT_BROKERS;

const ROOM_ID = 'sr' + Math.random().toString(36).slice(2, 8);  // fixed for page lifetime
const TOPIC = {
  c2s: `srclaw/${ROOM_ID}/c2s/`,        // + clientId : controller -> screen
  s2c: `srclaw/${ROOM_ID}/s2c/`,        // + clientId : screen -> controller
  presence: `srclaw/${ROOM_ID}/screen`, // retained heartbeat so phones see us instantly
};
const BOOT_ID = Math.random().toString(36).slice(2, 8);  // changes when screen reloads

let lastQRBroker = null;
function renderQR(brokerUrl) {
  if (brokerUrl === lastQRBroker) return;
  lastQRBroker = brokerUrl;
  const url = new URL('controller.html', location.href);
  url.searchParams.set('r', ROOM_ID);
  url.searchParams.set('b', brokerUrl);   // phones start on the screen's live broker
  const qrEl = document.getElementById('qr');
  qrEl.innerHTML = '';
  new QRCode(qrEl, { text:url.href, width:168, height:168, correctLevel:QRCode.CorrectLevel.M });
}
renderQR(BROKERS[0]);
document.getElementById('roomtag').textContent = '연결 준비 중…';

const roomTagEl = document.getElementById('roomtag');
const ROOM_LABEL = 'ROOM ' + ROOM_ID.replace(/^sr/, '').toUpperCase();
let mq = null, brokerIdx = 0, presenceTimer = null, consecFails = 0;
const conns = new Map();  // clientId -> conn-like object (used as the key in players/waiting)

function connectBroker() {
  const url = BROKERS[brokerIdx % BROKERS.length];
  roomTagEl.textContent = '중계 서버 연결 중…';
  const client = mqtt.connect(url, {
    keepalive: 20, clean: true, reconnectPeriod: 0, connectTimeout: 7000,
  });
  let wasUp = false;
  client.on('connect', () => {
    wasUp = true;
    consecFails = 0;
    mq = client;
    renderQR(url);   // keep the QR pointing at the broker we actually use
    roomTagEl.textContent = '서버 연결됨 ✓ · ' + ROOM_LABEL;
    client.subscribe(TOPIC.c2s + '+', { qos: 0 });
    publishPresence();
    clearInterval(presenceTimer);
    presenceTimer = setInterval(publishPresence, 5000);
  });
  client.on('message', onMqttMessage);
  client.on('error', () => { try { client.end(true); } catch(e){} });
  client.on('close', () => {
    clearInterval(presenceTimer);
    if (mq === client) mq = null;
    // move to the next broker if this one won't connect, or keeps dying
    if (!wasUp || ++consecFails >= 3) { brokerIdx++; consecFails = 0; }
    roomTagEl.textContent = '서버 재접속 중… · ' + ROOM_LABEL;
    setTimeout(connectBroker, 2000);
  });
}
function publishPresence() {
  if (mq) mq.publish(TOPIC.presence, JSON.stringify({ on:1, boot:BOOT_ID, ts:Date.now() }), { retain:true, qos:0 });
}
addEventListener('beforeunload', () => {
  try { mq && mq.publish(TOPIC.presence, '', { retain:true }); } catch(e){}  // clear retained presence
});

function getConn(cid) {
  let conn = conns.get(cid);
  if (!conn) {
    conn = {
      id: cid, open: true, lastSeen: performance.now(),
      send(obj) { if (mq) mq.publish(TOPIC.s2c + cid, JSON.stringify(obj), { qos: obj.t === 'joy' ? 0 : 1 }); },
    };
    conns.set(cid, conn);
  }
  return conn;
}
function dropConn(cid) {
  const conn = conns.get(cid);
  if (!conn) return;
  conn.open = false;
  conns.delete(cid);
  handleLeave(conn);
}
function onMqttMessage(topic, payload) {
  if (!topic.startsWith(TOPIC.c2s)) return;
  const cid = topic.slice(TOPIC.c2s.length);
  if (!cid || cid.includes('/')) return;
  let d;
  try { d = JSON.parse(payload.toString()); } catch(e) { return; }
  if (!d || typeof d !== 'object') return;
  const conn = getConn(cid);
  conn.lastSeen = performance.now();
  if (d.t === 'hb') {
    // heartbeat from a phone we don't know (e.g. we restarted) -> ask it to rejoin
    if (!players.has(conn) && !waiting.some(w => w.conn === conn)) sendTo(conn, { t:'rejoin' });
    return;
  }
  if (d.t === 'bye') { dropConn(cid); return; }
  handleData(conn, d);
}
// drop controllers that stopped heartbeating (phone locked, app killed, ...)
setInterval(() => {
  const now = performance.now();
  for (const [cid, c] of conns) if (now - c.lastSeen > 16000) dropConn(cid);
}, 5000);

function sendTo(conn, obj) {
  if (conn && conn.open) { try { conn.send(obj); } catch(e){} }
}
function handleData(conn, d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello') {
    // already in? re-send the role (phone re-hellos after a broker blip)
    const existing = players.get(conn);
    if (existing) { sendTo(conn, { t:'role', v:'active', color:PLAYER_COLORS_CSS[existing.slot], name:existing.name }); return; }
    const wpos = waiting.findIndex(w => w.conn === conn);
    if (wpos >= 0) { sendTo(conn, { t:'role', v:'busy', pos:wpos+1 }); return; }
    const name = String(d.name || '플레이어').slice(0, 8).trim() || '플레이어';
    const player = createPlayer(conn, conn, name);
    if (player) sendTo(conn, { t:'role', v:'active', color:PLAYER_COLORS_CSS[player.slot], name });
    else { waiting.push({ conn, name }); sendTo(conn, { t:'role', v:'busy', pos:waiting.length }); }
    return;
  }
  const p = players.get(conn);
  if (!p) return;
  if (d.t === 'joy') {
    p.lastJoyAt = performance.now();
    p.joy.x = THREE.MathUtils.clamp(+d.x || 0, -1, 1);
    p.joy.y = THREE.MathUtils.clamp(+d.y || 0, -1, 1);
  } else if (d.t === 'grab') {
    startGrab(p);
  }
}
function handleLeave(conn) {
  const wi = waiting.findIndex(w => w.conn === conn);
  if (wi >= 0) { waiting.splice(wi, 1); promoteWaiting(); }
  removePlayer(conn);
}
connectBroker();

// ---------- keyboard test player ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
    e.preventDefault();
    if (!players.has('local') && freeSlot() >= 0) createPlayer('local', null, '현장TEST');
    if (e.key === ' ') { const p = players.get('local'); if (p) startGrab(p); }
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });
function keyboardJoy() {
  if (drag.active) return;   // touch drag is steering the local claw
  const p = players.get('local');
  if (!p) return;
  let x = 0, y = 0;
  if (keys.ArrowLeft) x -= 1;
  if (keys.ArrowRight) x += 1;
  if (keys.ArrowUp) y -= 1;
  if (keys.ArrowDown) y += 1;
  p.joy.x = x; p.joy.y = y;
}

// ---------- touch fallback (single-device preview / kiosk testing) ----------
// drag anywhere on the 3D view to steer a local test claw, button to grab
const touchGrabBtn = document.getElementById('touchgrab');
const drag = { active:false, pid:null, sx:0, sy:0 };
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  if (!players.has('local')) {
    if (freeSlot() < 0) return;
    createPlayer('local', null, '체험모드');
  }
  touchGrabBtn.classList.add('show');
  drag.active = true; drag.pid = e.pointerId;
  drag.sx = e.clientX; drag.sy = e.clientY;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch(err) {}
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag.active || e.pointerId !== drag.pid) return;
  const p = players.get('local');
  if (!p) return;
  p.joy.x = THREE.MathUtils.clamp((e.clientX - drag.sx) / 70, -1, 1);
  p.joy.y = THREE.MathUtils.clamp((e.clientY - drag.sy) / 70, -1, 1);
});
function endDrag(e) {
  if (e.pointerId !== drag.pid) return;
  drag.active = false;
  const p = players.get('local');
  if (p) { p.joy.x = 0; p.joy.y = 0; }
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);
touchGrabBtn.addEventListener('click', () => {
  const p = players.get('local');
  if (p) startGrab(p);
});

// ---------- attract claw (shown when nobody is playing) ----------
const attract = { rig: createClawRig(0x9a9aa8, ''), t: 0 };
function updateAttract(dt) {
  const show = players.size === 0;
  attract.rig.root.visible = attract.rig.railBar.visible = show;
  if (!show) return;
  attract.t += dt;
  const x = Math.sin(attract.t*0.4) * 2.0;
  const z = Math.cos(attract.t*0.29) * 0.8;
  attract.rig.apply(x, RAIL_Y, z, 0.6 + Math.sin(attract.t*1.2)*0.35);
}

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  keyboardJoy();
  for (const p of players.values()) updatePlayer(p, dt);
  updateAttract(dt);
  physicsStep(dt);
  camera.position.x = Math.sin(now/1000*0.1)*0.3;
  camera.lookAt(0, 2.3, 0);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
